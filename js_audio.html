<script>
var AudioEngine = (function() {
  var ctx = null;
  var isMuted = false;

  function init() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) ctx = new AC();
    }
  }

  function play(type) {
    if (isMuted) return;
    init();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();

    var now = ctx.currentTime;
    if (type === 'tap') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(540, now);
      osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'jump') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(720, now + 0.28);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.28);
    } else if (type === 'flatline') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(880, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.12, now + 1.2);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 1.4);
    } else if (type === 'keepout') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(140, now);
      osc.frequency.setValueAtTime(90, now + 0.12);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.32);
    } else if (type === 'badend') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(110, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.6);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.6);
    } else if (type === 'chime') {
      var notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach(function(f, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, now + i * 0.1);
        gain.gain.setValueAtTime(0.12, now + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.38);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.38);
      });
    } else if (type === "preview") {
      // 428風 緊迫の電脳シンセジングル（ベースパルス＋鋭いシーケンスアルペジオ）
      var bassNotes = [110, 110, 146.83, 164.81];
      bassNotes.forEach(function(f, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(f, now + i * 0.2);
        gain.gain.setValueAtTime(0.18, now + i * 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.2);
        osc.stop(now + i * 0.2 + 0.35);
      });
      var leadNotes = [440, 523.25, 659.25, 880, 783.99, 1046.50];
      leadNotes.forEach(function(f, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(f, now + 0.8 + i * 0.12);
        gain.gain.setValueAtTime(0.14, now + 0.8 + i * 0.12);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8 + i * 0.12 + 0.25);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + 0.8 + i * 0.12);
        osc.stop(now + 0.8 + i * 0.12 + 0.25);
      });
      var notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach(function(f, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, now + i * 0.1);
        gain.gain.setValueAtTime(0.12, now + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.38);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.1);
        osc.stop(now + i * 0.1 + 0.38);
      });
    } else if (type === 'causality') {
      // 428風 因果変転・バタフライエフェクト 和音アルペジオ＆残響チャイム
      var freqs = [329.63, 440.00, 554.37, 659.25, 880.00, 1108.73, 1318.51];
      freqs.forEach(function(f, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = i % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(f, now + i * 0.05);
        gain.gain.setValueAtTime(0.09, now + i * 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.60);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + i * 0.05);
        osc.stop(now + i * 0.05 + 0.60);
      });
    } else if (type === 'pen_sketch') {
      // シンの金色の万年筆でガラスに絵を描く摩擦音（キュッキュッ）
      for (var s = 0; s < 3; s++) {
        var sTime = now + s * 0.12;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(850 + s * 120, sTime);
        osc.frequency.linearRampToValueAtTime(1350 - s * 80, sTime + 0.07);
        gain.gain.setValueAtTime(0.05, sTime);
        gain.gain.exponentialRampToValueAtTime(0.001, sTime + 0.07);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(sTime);
        osc.stop(sTime + 0.07);
      }
    } else if (type === 'heartbeat') {
      // 緊迫の心音（ドクン……）
      var osc1 = ctx.createOscillator();
      var gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(75, now);
      osc1.frequency.exponentialRampToValueAtTime(45, now + 0.10);
      gain1.gain.setValueAtTime(0.20, now);
      gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.10);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 0.10);

      var osc2 = ctx.createOscillator();
      var gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(65, now + 0.14);
      osc2.frequency.exponentialRampToValueAtTime(38, now + 0.25);
      gain2.gain.setValueAtTime(0.16, now + 0.14);
      gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now + 0.14);
      osc2.stop(now + 0.25);
    } else if (type === 'scan') {
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.linearRampToValueAtTime(1280, now + 0.4);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    } else if (type === 'tawakichi_foam') {
      // タワ吉の超高濃度低刺激性泡スプレー（ブシュゥゥゥッ！！）
      var bufferSize = Math.floor(ctx.sampleRate * 0.35);
      var noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var output = noiseBuffer.getChannelData(0);
      for (var i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }
      var whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      var filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.setValueAtTime(2400, now);
      filter.frequency.exponentialRampToValueAtTime(700, now + 0.35);
      filter.Q.value = 1.8;
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      whiteNoise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      whiteNoise.start(now);
      whiteNoise.stop(now + 0.35);
    } else if (type === 'tawakichi_mop') {
      // タワ吉の高速回転モップ磨き上げ音（キュッ！キュッ！）
      for (var m = 0; m < 2; m++) {
        var mTime = now + m * 0.12;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(1300, mTime);
        osc.frequency.linearRampToValueAtTime(2600, mTime + 0.04);
        osc.frequency.linearRampToValueAtTime(1600, mTime + 0.08);
        gain.gain.setValueAtTime(0.12, mTime);
        gain.gain.exponentialRampToValueAtTime(0.001, mTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(mTime);
        osc.stop(mTime + 0.08);
      }
    }
  }

  function toggleMute() {
    isMuted = !isMuted;
    var icon = document.getElementById("audioIcon");
    if (icon) icon.textContent = isMuted ? "🔇" : "🔊";

    // BGMゲインも連動して即時消音/復帰
    if (bgmMasterGain && ctx) {
      var targetGain = !isMuted && isBgmEnabled ? bgmVolume : 0.0001;
      bgmMasterGain.gain.setValueAtTime(bgmMasterGain.gain.value, ctx.currentTime);
      bgmMasterGain.gain.linearRampToValueAtTime(targetGain, ctx.currentTime + 0.1);
    }
    return isMuted;
  }

  // iOS / iPadOS Safari Web Audio 自動再生制限解除リスナー
  function setupUserGestureUnlock() {
    var unlock = function() {
      init();
      if (ctx && ctx.state === "suspended") {
        ctx.resume();
      }
      document.removeEventListener('touchstart', unlock, true);
      document.removeEventListener('touchend', unlock, true);
      document.removeEventListener('click', unlock, true);
    };
    document.addEventListener('touchstart', unlock, true);
    document.addEventListener('touchend', unlock, true);
    document.addEventListener('click', unlock, true);
  }
  if (typeof document !== "undefined") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupUserGestureUnlock);
    } else {
      setupUserGestureUnlock();
    }
  }

  // ============================================================================
  // 【旋律柱】プロシージャルBGMエンジン (Procedural Web Audio Synthesizer)
  // 通信負荷 0KB・完全自己完結・ローパスフィルター(650Hz)による微弱音量(0.035)設計
  // ============================================================================
  var isBgmEnabled = true;
  var bgmVolume = 0.035; // かすかに聞こえる約3.5%の微弱マスターゲイン
  var currentBgmKey = null;
  var bgmMasterGain = null;
  var bgmFilter = null;
  var bgmTimerId = null;
  var bgmStartTime = 0;
  var bgmStep = 0;

  // ローカルストレージからBGM設定復元
  try {
    var savedBgmSetting = localStorage.getItem("pj_bgm_enabled");
    if (savedBgmSetting !== null) {
      isBgmEnabled = (savedBgmSetting === "true");
    }
  } catch (e) {}

  function initBgmNodes() {
    init();
    if (!ctx) return;
    if (!bgmMasterGain) {
      bgmMasterGain = ctx.createGain();
      bgmMasterGain.gain.setValueAtTime(isBgmEnabled && !isMuted ? bgmVolume : 0.0001, ctx.currentTime);
      bgmMasterGain.connect(ctx.destination);
    }
    if (!bgmFilter) {
      bgmFilter = ctx.createBiquadFilter();
      bgmFilter.type = "lowpass";
      bgmFilter.frequency.setValueAtTime(650, ctx.currentTime); // キンキンする高音をバッサリカット
      bgmFilter.Q.setValueAtTime(1.0, ctx.currentTime);
      bgmFilter.connect(bgmMasterGain);
    }
  }

  // ノート発音ヘルパー (ADSR エンベロープ付き)
  function playSynthVoice(freq, startTime, dur, type, vel, targetNode) {
    if (!ctx || isMuted || !isBgmEnabled) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "triangle";
    osc.frequency.setValueAtTime(freq, startTime);

    var maxV = (vel || 0.5) * 0.4;
    var attackTime = Math.min(0.08, dur * 0.2);
    var releaseTime = Math.min(0.35, dur * 0.4);

    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.linearRampToValueAtTime(maxV, startTime + attackTime);
    gain.gain.setValueAtTime(maxV * 0.75, startTime + dur - releaseTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

    osc.connect(gain);
    gain.connect(targetNode || bgmFilter || ctx.destination);

    osc.start(startTime);
    osc.stop(startTime + dur + 0.05);
  }

  // スケジューリングループ (Lookahead方式)
  function scheduleBgmEvents() {
    if (!ctx || !currentBgmKey || !isBgmEnabled || isMuted) return;
    var data = BGM_DATA[currentBgmKey];
    if (!data) return;

    var secPerBeat = 60.0 / data.bpm;
    var secPerBar = secPerBeat * 4.0;
    var totalLoopSec = secPerBar * data.bars;

    var now = ctx.currentTime;
    if (bgmStartTime === 0) bgmStartTime = now + 0.05;

    // 現在時間から未来 0.4 秒以内にある小節をスケジュール
    var scheduleAhead = 0.4;
    var currentCycleTime = (now - bgmStartTime) % totalLoopSec;

    // 前回のチェック以降のイベントを発音
    // 伴奏とメロディを小節単位でスケジュール
    var currBar = Math.floor(currentCycleTime / secPerBar);
    var nextBar = (currBar + 1) % data.bars;

    // 各バーの頭で和音とベースを発音
    var chord = data.chords[currBar % data.chords.length];
    if (chord && (!chord._lastSched || Math.abs(now - chord._lastSched) > secPerBar * 0.8)) {
      chord._lastSched = now;
      var barStartTime = now + 0.02;

      // 1. 低音ベース / パルス
      if (currentBgmKey === 'daniel') {
        // 心拍パルス (トクン…トクン…)
        playSynthVoice(chord.bass, barStartTime, 0.18, "sine", 0.7);
        playSynthVoice(chord.bass * 0.85, barStartTime + 0.25, 0.15, "sine", 0.5);
        playSynthVoice(chord.bass, barStartTime + secPerBeat * 2, 0.18, "sine", 0.6);
        playSynthVoice(chord.bass * 0.85, barStartTime + secPerBeat * 2 + 0.25, 0.15, "sine", 0.4);
      } else if (currentBgmKey === 'ren') {
        // 16分パルシブベース
        for (var p = 0; p < 8; p++) {
          var pTime = barStartTime + p * (secPerBeat / 2);
          playSynthVoice(chord.bass, pTime, secPerBeat * 0.35, "sawtooth", (p % 2 === 0 ? 0.6 : 0.4));
        }
      } else if (currentBgmKey === 'tawakichi') {
        // マリオ風スタッカート・ウォーキングベース（ポン・チャッ・ポン・チャッ！）
        for (var b = 0; b < 4; b++) {
          var bTime = barStartTime + b * secPerBeat;
          var bFreq = (b % 2 === 0) ? chord.bass : chord.bass * 1.5;
          playSynthVoice(bFreq, bTime, secPerBeat * 0.45, "square", 0.55);
        }
      } else if (currentBgmKey === 'menu') {
        // サイバーパンク・アルペジオパルス
        for (var b = 0; b < 4; b++) {
          var bTime = barStartTime + b * secPerBeat;
          playSynthVoice(chord.bass, bTime, secPerBeat * 0.4, "triangle", 0.5);
          if (chord.pad && chord.pad.length > 0) {
            playSynthVoice(chord.pad[b % chord.pad.length], bTime + (secPerBeat / 2), secPerBeat * 0.35, "sine", 0.35);
          }
        }
      } else {
        // 深い持続ベース (title, elena, climax, ending)
        playSynthVoice(chord.bass, barStartTime, secPerBar * 0.95, "triangle", 0.65);
      }

      // 2. 温かい和音パッド
      if (chord.pad) {
        for (var i = 0; i < chord.pad.length; i++) {
          playSynthVoice(chord.pad[i], barStartTime, secPerBar * 0.92, "sine", 0.35);
        }
      }

      // 3. メロディライン
      for (var m = 0; m < data.melody.length; m++) {
        var mel = data.melody[m];
        if (mel.bar === currBar) {
          var melTime = barStartTime + mel.beat * secPerBeat;
          var melType = mel.type || data.melodyType || "triangle";
          var melVel = (mel.vel !== undefined) ? mel.vel : 0.8;
          playSynthVoice(mel.freq, melTime, mel.dur, melType, melVel);
        }
      }
    }
  }

  function playBGM(key) {
    if (!key) return;
    initBgmNodes();
    if (!ctx) return;
    if (ctx.state === "suspended") ctx.resume();

    // 既に同一曲再生中なら継続
    if (currentBgmKey === key && bgmTimerId) return;

    currentBgmKey = key;
    bgmStartTime = 0;

    // 既存BGMループ停止
    if (bgmTimerId) {
      clearInterval(bgmTimerId);
      bgmTimerId = null;
    }

    // 楽曲固有の可変ローパスフィルター周波数を適用（タワ吉の8bitハイトーンやエンディングのきらめきを開放）
    var data = BGM_DATA[key];
    if (bgmFilter && ctx && data) {
      var targetFilter = data.filterFreq || 800;
      var curFilterVal = bgmFilter.frequency.value || 800;
      bgmFilter.frequency.setValueAtTime(curFilterVal, ctx.currentTime);
      bgmFilter.frequency.exponentialRampToValueAtTime(Math.max(100, Math.min(10000, targetFilter)), ctx.currentTime + 0.3);
    }

    // フェードイン
    if (bgmMasterGain) {
      var now = ctx.currentTime;
      var targetGain = isBgmEnabled && !isMuted ? bgmVolume : 0.0001;
      bgmMasterGain.gain.setValueAtTime(0.0001, now);
      bgmMasterGain.gain.linearRampToValueAtTime(targetGain, now + 0.6);
    }

    // 初回即時発音 & タイマー起動
    scheduleBgmEvents();
    bgmTimerId = setInterval(scheduleBgmEvents, 120);
  }

  function stopBGM(fadeSec) {
    var fTime = (typeof fadeSec === "number") ? fadeSec : 0.5;
    if (bgmMasterGain && ctx) {
      var now = ctx.currentTime;
      bgmMasterGain.gain.setValueAtTime(bgmMasterGain.gain.value, now);
      bgmMasterGain.gain.linearRampToValueAtTime(0.0001, now + fTime);
    }
    setTimeout(function() {
      if (bgmTimerId) {
        clearInterval(bgmTimerId);
        bgmTimerId = null;
      }
      currentBgmKey = null;
    }, Math.round(fTime * 1000) + 50);
  }

  function toggleBgm() {
    isBgmEnabled = !isBgmEnabled;
    try {
      localStorage.setItem("pj_bgm_enabled", String(isBgmEnabled));
    } catch (e) {}

    if (bgmMasterGain && ctx) {
      var now = ctx.currentTime;
      var targetGain = isBgmEnabled && !isMuted ? bgmVolume : 0.0001;
      bgmMasterGain.gain.setValueAtTime(bgmMasterGain.gain.value, now);
      bgmMasterGain.gain.linearRampToValueAtTime(targetGain, now + 0.3);
    }
    if (isBgmEnabled && currentBgmKey && !bgmTimerId) {
      playBGM(currentBgmKey);
    }
    return isBgmEnabled;
  }

  function setBgmVolume(val) {
    bgmVolume = Math.max(0.0, Math.min(1.0, val));
    if (bgmMasterGain && ctx && isBgmEnabled && !isMuted) {
      bgmMasterGain.gain.setValueAtTime(bgmVolume, ctx.currentTime);
    }
  }

  return {
    init: init,
    play: play,
    toggleMute: toggleMute,
    playBGM: playBGM,
    stopBGM: stopBGM,
    toggleBgm: toggleBgm,
    setBgmVolume: setBgmVolume,
    isBgmEnabled: function() { return isBgmEnabled; },
    getCurrentBgm: function() { return currentBgmKey; }
  };
