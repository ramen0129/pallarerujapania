<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      background-color: #0a0a0c;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      box-sizing: border-box;
      text-align: center;
      overflow: hidden;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(244, 63, 94, 0.2);
      border-top-color: #f43f5e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .text {
      font-size: 11px;
      letter-spacing: 0.05em;
      color: #94a3b8;
    }
    .val {
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="text">画面サイズを測定中...</div>
  <div id="resText" class="text" style="font-size: 10px; margin-top: 4px;"></div>

  <script>
    (function() {
      // 端末の有効画面サイズを取得
      var screenW = window.screen.availWidth || window.innerWidth || 1280;
      var screenH = window.screen.availHeight || window.innerHeight || 720;

      // 画面の約85%を使いつつ、16:9比率をベースに安全マージンを計算
      var targetW = Math.floor(screenW * 0.85);
      var targetH = Math.floor(screenH * 0.82);

      // 解像度ごとの最適スロット設定
      if (screenW <= 1366) {
        // Chromebook / 小型ノートPC (1366x768等)
        targetW = Math.min(targetW, 940);
        targetH = Math.min(targetH, 530);
      } else if (screenW <= 1600) {
        // 標準ノートPC (1600x900等)
        targetW = Math.min(targetW, 1060);
        targetH = Math.min(targetH, 610);
      } else {
        // フルHD・大型PC (1920x1080以上)
        targetW = Math.min(targetW, 1200);
        targetH = Math.min(targetH, 700);
      }

      // 最小・最大リミット
      targetW = Math.max(880, targetW);
      targetH = Math.max(500, targetH);

      document.getElementById('resText').innerHTML = '最適枠: <span class="val">' + targetW + ' × ' + targetH + '</span>';

      // サーバーを呼び出して可変枠で本編を開く
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.openGameWithDynamicSize(targetW, targetH);
      }
    })();
  </script>
</body>
</html>
