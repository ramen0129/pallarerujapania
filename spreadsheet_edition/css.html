<style>
  @import url('https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,700&family=Orbitron:wght@600;800;900&family=Russo+One&family=Shippori+Mincho:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');

  :root {
    --font-novel: 'Shippori Mincho', 'Noto Serif JP', serif;
    --font-hud: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'JetBrains Mono', 'Orbitron', monospace;
    --font-tech: 'Orbitron', 'JetBrains Mono', monospace;
    --font-logo: 'Orbitron', 'Russo One', 'Dela Gothic One', 'Zen Kaku Gothic New', sans-serif;
  }

  body {
    font-family: var(--font-hud);
    background-color: #030712;
    color: #f1f5f9;
    user-select: none;
    -webkit-user-select: none;
    letter-spacing: 0.02em;
  }

  /* ヘッダー専用 力強いロゴタイポグラフィ */
  .app-header-logo {
    font-family: var(--font-logo);
    font-weight: 900;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.85rem;
    line-height: 1.2;
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.4), 0 2px 4px rgba(0, 0, 0, 0.9);
    display: inline-flex;
    align-items: center;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @media (min-width: 640px) {
    .app-header-logo {
      font-size: 0.95rem;
      letter-spacing: 0.16em;
    }
  }
  #btnLogoHome:hover .app-header-logo {
    color: #38bdf8;
    text-shadow: 0 0 14px rgba(56, 189, 248, 0.6), 0 0 4px rgba(56, 189, 248, 0.9);
    transform: scale(1.02);
  }

  .font-story {
    font-family: var(--font-novel);
  }
  .font-sans-jp, .font-hud {
    font-family: var(--font-hud);
  }
  .font-mono-num, .font-mono {
    font-family: var(--font-mono);
  }
  .font-tech {
    font-family: var(--font-tech);
    letter-spacing: 0.08em;
  }

  /* サイバーパンク・タクティカルグリッド背景 */
  .cyber-grid-bg {
    background-color: #030712;
    background-image: 
      radial-gradient(rgba(14, 165, 233, 0.08) 1px, transparent 0),
      radial-gradient(rgba(245, 158, 11, 0.05) 1px, transparent 0);
    background-size: 28px 28px;
    background-position: 0 0, 14px 14px;
  }

  /* 428 KEEP OUT 斜め警戒ストライプ */
  .keep-out-stripe {
    background: repeating-linear-gradient(
      -45deg,
      #b91c1c,
      #b91c1c 20px,
      #000000 20px,
      #000000 40px
    );
  }

  /* 428式 TIPS 逆照射アンカーリンク */
  .tip-link {
    color: #38bdf8;
    border-bottom: 2px dashed #0284c7;
    cursor: pointer;
    font-weight: 700;
    padding: 0 4px;
    margin: 0 1px;
    border-radius: 3px;
    background-color: rgba(14, 165, 233, 0.12);
    transition: all 0.2s ease;
  }
  .tip-link:hover {
    background-color: rgba(56, 189, 248, 0.3);
    border-bottom-style: solid;
    color: #bae6fd;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
  }

  /* TIPS既読・挑戦可能：黄色（アンバー） */
  .tip-link.tip-yellow {
    color: #fbbf24 !important;
    border-bottom: 2px dashed #d97706 !important;
    background-color: rgba(245, 158, 11, 0.15) !important;
    text-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
  }
  .tip-link.tip-yellow:hover {
    background-color: rgba(245, 158, 11, 0.3) !important;
    color: #fef3c7 !important;
    text-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
  }

  /* TIPSクイズ正解・完全習得：ピンク（ネオン桜） */
  .tip-link.tip-pink {
    color: #f472b6 !important;
    border-bottom: 2px solid #ec4899 !important;
    background-color: rgba(236, 72, 153, 0.18) !important;
    text-shadow: 0 0 8px rgba(244, 114, 182, 0.6);
  }
  .tip-link.tip-pink:hover {
    background-color: rgba(236, 72, 153, 0.35) !important;
    color: #fdf2f8 !important;
    text-shadow: 0 0 12px rgba(236, 72, 153, 0.9);
  }

  /* クイズ用ボックステーマ */
  .tip-quiz-box {
    border: 1px solid rgba(245, 158, 11, 0.4);
    background: linear-gradient(135deg, rgba(245, 158, 11, 0.08), rgba(15, 23, 42, 0.95));
    border-radius: 1rem;
    padding: 1rem;
    margin-top: 1rem;
    box-shadow: 0 4px 20px -2px rgba(245, 158, 11, 0.15);
  }
  .tip-quiz-choice-btn {
    width: 100%;
    text-align: left;
    padding: 0.75rem 1rem;
    border-radius: 0.75rem;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(30, 41, 59, 0.7);
    color: #f1f5f9;
    font-size: 0.82rem;
    font-weight: 500;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .tip-quiz-choice-btn:hover:not(:disabled) {
    border-color: #fbbf24;
    background: rgba(245, 158, 11, 0.2);
    transform: translateX(4px);
    color: #ffffff;
    box-shadow: 0 0 12px rgba(245, 158, 11, 0.3);
  }
  .tip-quiz-choice-btn.correct-choice {
    border-color: #ec4899 !important;
    background: rgba(236, 72, 153, 0.25) !important;
    color: #fdf2f8 !important;
    font-weight: 700;
    box-shadow: 0 0 15px rgba(236, 72, 153, 0.5) !important;
  }
  .tip-quiz-choice-btn.wrong-choice {
    border-color: #ef4444 !important;
    background: rgba(239, 68, 68, 0.2) !important;
    color: #fca5a5 !important;
    opacity: 0.7;
  }
  .tip-desc-highlight {
    animation: tipDescFlash 2s ease-in-out infinite alternate;
    border-color: rgba(239, 68, 68, 0.8) !important;
    background: rgba(239, 68, 68, 0.15) !important;
  }
  @keyframes tipDescFlash {
    0% { box-shadow: 0 0 4px rgba(239, 68, 68, 0.3); }
    100% { box-shadow: 0 0 16px rgba(239, 68, 68, 0.7); }
  }

  /* 真エンド後解禁：赤字TIPS（外伝追想録リンク） */
  .tip-link-red,
  .tip-link.tip-red {
    color: #f87171 !important;
    border-bottom: 2px solid #ef4444 !important;
    background-color: rgba(239, 68, 68, 0.2) !important;
    text-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
    animation: tipRedPulse 2s infinite ease-in-out;
  }
  .tip-link-red:hover,
  .tip-link.tip-red:hover {
    background-color: rgba(239, 68, 68, 0.4) !important;
    color: #fecaca !important;
    text-shadow: 0 0 14px rgba(248, 113, 113, 1);
    border-bottom: 2px solid #fca5a5 !important;
  }
  @keyframes tipRedPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    50% { box-shadow: 0 0 8px 2px rgba(239, 68, 68, 0.45); }
  }

  @keyframes tipPulseGlow {
    0% { background-color: rgba(56, 189, 248, 0.5); box-shadow: 0 0 12px rgba(56, 189, 248, 0.8); }
    50% { background-color: rgba(56, 189, 248, 0.25); box-shadow: 0 0 6px rgba(56, 189, 248, 0.4); }
    100% { background-color: transparent; box-shadow: none; }
  }
  .tip-link-focused {
    animation: tipPulseGlow 1.5s ease-out;
    border-radius: 4px;
    padding: 0 2px;
  }

  /* 外伝・追想録JUMPボタン */
  .btn-secret-jump,
  .btn-canaan-jump {
    background: linear-gradient(135deg, rgba(220, 38, 38, 0.85), rgba(153, 27, 27, 0.95));
    border: 1px solid #ef4444;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
    animation: canaanGlow 2.4s infinite ease-in-out;
  }
  .btn-secret-jump:hover,
  .btn-canaan-jump:hover {
    background: linear-gradient(135deg, rgba(239, 68, 68, 0.95), rgba(185, 28, 28, 1));
    border-color: #f87171;
    box-shadow: 0 0 25px rgba(239, 68, 68, 0.7);
    transform: translateY(-1px);
  }
  @keyframes canaanGlow {
    0%, 100% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.35); }
    50% { box-shadow: 0 0 22px rgba(239, 68, 68, 0.75); }
  }

  /* テキスト送りアニメーション */
  .para-in {
    animation: paraFadeIn 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @keyframes paraFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 428式 センタリング・キメ台詞演出 (Typography Focus) */
  .para-center {
    text-align: center;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.85;
    color: #fef08a; /* amber-200 */
    margin: 1.25rem 0;
    padding: 0.6rem 0.5rem;
    letter-spacing: 0.06em;
    text-shadow: 0 0 14px rgba(245, 158, 11, 0.4);
    animation: paraCenterIn 0.48s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @media (min-width: 640px) {
    .para-center {
      font-size: 1.35rem;
    }
  }
  @keyframes paraCenterIn {
    from { opacity: 0; transform: scale(0.96) translateY(6px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  /* 428式 クライマックス・インパクト (大文字・赤/金光彩) */
  .para-impact {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 900;
    line-height: 1.6;
    color: #f87171; /* red-400 */
    margin: 1.5rem 0;
    padding: 0.75rem 0.5rem;
    letter-spacing: 0.08em;
    text-shadow: 0 0 18px rgba(239, 68, 68, 0.7);
    animation: paraImpactIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  @media (min-width: 640px) {
    .para-impact {
      font-size: 1.6rem;
    }
  }
  @keyframes paraImpactIn {
    0% { opacity: 0; transform: scale(1.15) translateY(-4px); filter: brightness(2); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1); }
  }

  /* 428式 モノローグ・囁き (静寂・内省・回想) */
  .para-whisper {
    text-align: center;
    font-size: 0.95rem;
    font-style: italic;
    line-height: 1.8;
    color: #94a3b8; /* slate-400 */
    margin: 1rem 0;
    padding: 0.4rem 0.5rem;
    letter-spacing: 0.05em;
    animation: paraWhisperIn 0.5s ease-out forwards;
  }
  @media (min-width: 640px) {
    .para-whisper {
      font-size: 1.05rem;
    }
  }
  @keyframes paraWhisperIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* タップ送りマーカー */
  .blink-indicator {
    animation: blinkMarker 1.1s infinite ease-in-out;
  }
  @keyframes blinkMarker {
    0%, 100% { opacity: 0.3; transform: translateY(0); }
    50% { opacity: 1; transform: translateY(3px); }
  }

  /* 画面振動VFX */
  .shake-screen {
    animation: shakeAnim 0.36s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
  }
  @keyframes shakeAnim {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 4px); }
    40% { transform: translate(6px, -4px); }
    60% { transform: translate(-3px, 3px); }
    80% { transform: translate(3px, -2px); }
  }

  /* 光学スキャンレーザー */
  .scanner-beam {
    position: absolute;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, transparent, #ef4444, #38bdf8, #ef4444, transparent);
    box-shadow: 0 0 16px #ef4444, 0 0 28px #38bdf8;
    animation: scanSweep 2.2s infinite ease-in-out;
  }
  @keyframes scanSweep {
    0% { top: 4%; opacity: 0.7; }
    50% { top: 94%; opacity: 1; }
    100% { top: 4%; opacity: 0.7; }
  }

  .gold-glow {
    animation: goldGlowAnim 2.2s infinite alternate;
  }
  @keyframes goldGlowAnim {
    from { box-shadow: 0 0 15px rgba(234, 179, 8, 0.3); border-color: rgba(234, 179, 8, 0.5); }
    to { box-shadow: 0 0 35px rgba(234, 179, 8, 0.85); border-color: rgba(234, 179, 8, 1); }
  }

  /* サイバーパルス・インジケータ */
  .pulse-live {
    animation: pulseLiveAnim 1.6s infinite ease-in-out;
  }
  @keyframes pulseLiveAnim {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.85); }
  }

  /* 428 キャラクターカード シネマティックホバー */
  .char-card-glow {
    transition: all 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    overflow: hidden;
  }
  .char-card-glow::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
    transform: skewX(-25deg);
    transition: 0.6s ease;
  }
  .char-card-glow:hover::before {
    left: 150%;
  }
  .char-card-glow:hover {
    transform: translateY(-3px);
  }

  .glow-emerald {
    box-shadow: 0 4px 20px -5px rgba(16, 185, 129, 0.15);
  }
  .glow-emerald:hover {
    box-shadow: 0 16px 36px -8px rgba(16, 185, 129, 0.38), 0 0 0 1px rgba(52, 211, 153, 0.7);
  }
  .glow-sky {
    box-shadow: 0 4px 20px -5px rgba(14, 165, 233, 0.15);
  }
  .glow-sky:hover {
    box-shadow: 0 16px 36px -8px rgba(14, 165, 233, 0.38), 0 0 0 1px rgba(56, 189, 248, 0.7);
  }
  .glow-amber {
    box-shadow: 0 4px 20px -5px rgba(245, 158, 11, 0.15);
  }
  .glow-amber:hover {
    box-shadow: 0 16px 36px -8px rgba(245, 158, 11, 0.38), 0 0 0 1px rgba(251, 191, 36, 0.7);
  }

  /* 3色シンクロ クライマックスオーラ */
  .climax-sync-aura {
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(14, 165, 233, 0.15), rgba(245, 158, 11, 0.2));
    animation: climaxAuraAnim 4s infinite linear;
  }
  @keyframes climaxAuraAnim {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  /* キャラクターセリフ演出クォート */
  .quote-box {
    position: relative;
    padding-left: 1.25rem;
    border-left: 3px solid currentColor;
    font-style: italic;
  }
  .quote-box::before {
    content: "“";
    position: absolute;
    left: 0.2rem;
    top: -0.4rem;
    font-size: 1.4rem;
    opacity: 0.4;
    font-family: serif;
  }

  /* タイムライン進捗マイクロバー */
  .char-time-bar {
    position: relative;
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 9999px;
    overflow: hidden;
  }
  .char-time-bar-fill {
    height: 100%;
    border-radius: 9999px;
    transition: width 0.4s ease;
  }

  /* ========================================================
     レスポンシブ・マルチデバイス適応レイアウト (Googleサイト風)
     Mobile (<768px), Tablet (768px-1023px GIGA端末), Desktop (>=1024px)
     ======================================================== */
  html, body {
    height: 100%;
    height: 100dvh;
    min-height: -webkit-fill-available;
  }

  .app-viewport {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* モバイル最適化 (<768px) */
  @media (max-width: 767px) {
    .novel-screen-height {
      height: calc(100dvh - 120px) !important;
      max-height: 82vh !important;
    }
    .auth-screen-height {
      max-height: calc(100dvh - 90px) !important;
    }
    .choice-btn-touch {
      min-height: 48px;
      font-size: 0.875rem !important;
    }
    .tip-link {
      padding: 2px 5px;
      display: inline-block;
      line-height: 1.35;
    }
  }

  /* タブレット・GIGA端末最適化 (768px - 1023px) */
  @media (min-width: 768px) and (max-width: 1023px) {
    .novel-screen-height {
      height: 78vh !important;
    }
    .char-select-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  /* デスクトップ最適化 (>=1024px) */
  @media (min-width: 1024px) {
    .novel-screen-height {
      height: 80vh !important;
    }
    .main-container-adaptive {
      max-width: 56rem !important; /* 896px max for optimal typography */
    }
  }

  /* ========================================================
     428式 フルスクリーン TIPS ポップアップモーダル
     ======================================================== */
  .tip-modal-overlay {
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background-color: rgba(3, 7, 18, 0.88);
  }

  .tip-book-container {
    background: linear-gradient(180deg, rgba(15, 23, 42, 0.98) 0%, rgba(3, 7, 18, 0.98) 100%);
    border: 2px solid rgba(56, 189, 248, 0.6);
    box-shadow: 0 0 35px rgba(14, 165, 233, 0.25), 0 25px 50px -12px rgba(0, 0, 0, 0.85);
    border-radius: 1.25rem;
    position: relative;
    overflow: hidden;
  }

  .tip-book-header {
    background: linear-gradient(90deg, rgba(14, 165, 233, 0.15), rgba(15, 23, 42, 0.8));
    border-bottom: 1px solid rgba(56, 189, 248, 0.3);
  }

  /* TIPS・判例図鑑アーカイブ用カード */
  .archive-card {
    transition: all 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
  }
  .archive-card:hover {
    transform: translateY(-2px);
    border-color: rgba(56, 189, 248, 0.5);
    box-shadow: 0 8px 24px -4px rgba(14, 165, 233, 0.25);
  }
  .archive-card.read-blue,
  .archive-card.unlocked {
    border-left: 3px solid #38bdf8;
    border-color: rgba(56, 189, 248, 0.4);
    background: rgba(14, 165, 233, 0.05);
  }
  .archive-card.mastered-pink,
  .archive-card.mastered-yellow {
    border-left: 3px solid #f472b6;
    border-color: rgba(236, 72, 153, 0.6);
    background: rgba(236, 72, 153, 0.08);
    box-shadow: 0 0 15px rgba(236, 72, 153, 0.15);
  }
  .archive-card.mastered-pink:hover,
  .archive-card.mastered-yellow:hover {
    border-color: #f472b6;
    box-shadow: 0 0 20px rgba(236, 72, 153, 0.35);
  }
  .archive-card.locked {
    opacity: 0.5;
    filter: grayscale(80%);
  }

  .filter-pill {
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .filter-pill.active {
    background: #0284c7;
    color: #ffffff;
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
  }

  /* BAD END 図鑑アーカイブ フィルタピル */
  .bad-filter-pill {
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .bad-filter-pill.active {
    background: #be123c;
    color: #ffffff;
    border-color: #f43f5e;
    box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
  }

  /* ========================================================
     428式 因果変転・バタフライエフェクト演出
     ======================================================== */
  @keyframes causalityBannerIn {
    0% {
      opacity: 0;
      transform: translate(-50%, -24px) scale(0.9);
      filter: brightness(2.2);
    }
    12% {
      opacity: 1;
      transform: translate(-50%, 0) scale(1.03);
      filter: brightness(1.2);
    }
    18% {
      transform: translate(-50%, 0) scale(1.0);
      filter: brightness(1.0);
    }
    82% {
      opacity: 1;
      transform: translate(-50%, 0) scale(1.0);
      filter: brightness(1.0);
    }
    100% {
      opacity: 0;
      transform: translate(-50%, -12px) scale(0.95);
      filter: brightness(0.7);
    }
  }

  .causality-banner-anim {
    animation: causalityBannerIn 3.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes causalityRipple {
    0% {
      box-shadow: inset 0 0 0 0 rgba(56, 189, 248, 0);
    }
    25% {
      box-shadow: inset 0 0 60px 15px rgba(56, 189, 248, 0.4), inset 0 0 120px 30px rgba(245, 158, 11, 0.3);
    }
    100% {
      box-shadow: inset 0 0 0 0 rgba(56, 189, 248, 0);
    }
  }

  .causality-ripple-anim {
    animation: causalityRipple 1.6s ease-out forwards;
  }

  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .animate-spin-slow {
    animation: spinSlow 8s linear infinite;
  }

  /* ==========================================
     時間軸図鑑（タイムラインチャート）UI拡張スタイル
     ========================================== */
  .chart-tab-btn {
    background: rgba(23, 23, 23, 0.7);
    color: #a3a3a3;
    border: 1px solid #333;
  }
  .chart-tab-btn:hover {
