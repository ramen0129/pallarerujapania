<script>
var UIController = (function() {
  var tipCooldownUntil = 0;
  var lastClickedTipTarget = null;

  function switchView(viewName, skipHistoryPush) {
    var views = ["viewAuth", "viewNovel", "viewKeepOut", "viewBadEnd", "viewTrueEnd"];
    views.forEach(function(v) {
      var el = document.getElementById(v);
      if (el) el.classList.add("hidden");
    });

    var targetId = "viewNovel";
    if (viewName === "auth" || viewName === "start") {
      targetId = "viewAuth";
    } else if (viewName === "keepout") {
      targetId = "viewKeepOut";
      if (typeof AudioEngine !== "undefined" && AudioEngine.stopBGM) AudioEngine.stopBGM(0.3);
    } else if (viewName === "badend") {
      targetId = "viewBadEnd";
      if (typeof AudioEngine !== "undefined" && AudioEngine.stopBGM) AudioEngine.stopBGM(0.3);
    } else if (viewName === "trueend") {
      targetId = "viewTrueEnd";
      if (typeof AudioEngine !== "undefined" && AudioEngine.playBGM) AudioEngine.playBGM("ending");
    }

    var targetEl = document.getElementById(targetId);
    if (targetEl) targetEl.classList.remove("hidden");

    var isNovel = (viewName === "novel");
    var tabCont = document.getElementById("charTabContainer");
    if (tabCont) tabCont.classList.toggle("hidden", !isNovel);

    // 時間軸図鑑ボタン：認証完了後（司令室、ノベル、BAD END、KEEP OUT）は常時アクセス可能！
    var btnChart = document.getElementById("btnChart");
    var authScreen = document.getElementById("authLoginScreen");
    var isAuthScreenVisible = authScreen && !authScreen.classList.contains("hidden");
    if (btnChart) {
      btnChart.classList.toggle("hidden", isAuthScreenVisible);
    }

    // 因果管制室へ戻るボタン：ノベル画面や結果画面等で表示（auth画面以外）
    var btnGoCockpit = document.getElementById("btnGoCockpit");
    if (btnGoCockpit) btnGoCockpit.classList.toggle("hidden", viewName === "auth");
    var btnHome = document.getElementById("btnHome");
    if (btnHome) btnHome.classList.toggle("hidden", viewName === "auth");

    if (!skipHistoryPush) {
      try {
        if (window.history && window.history.pushState) {
          window.history.pushState({ view: viewName }, "", "#" + viewName);
        }
      } catch (e) {
        // GAS iframe等でのSecurityError抑制
      }
    }
  }

  function updateHeaderTabs() {
    var state = TimelineState.getState();
    var c = state.currentChar;

    var tabA = document.getElementById("tabCharA");
    var tabB = document.getElementById("tabCharB");
    var tabC = document.getElementById("tabCharC");

    var base = "char-tab px-2.5 py-1 rounded-lg font-bold transition-all flex items-center gap-1 ";
    if (tabA) tabA.className = base + (c === "A" ? "text-emerald-400 bg-neutral-800 border border-emerald-500" : "text-neutral-400 hover:bg-neutral-800");
    if (tabB) tabB.className = base + (c === "B" ? "text-sky-400 bg-neutral-800 border border-sky-500" : "text-neutral-400 hover:bg-neutral-800");
    if (tabC) tabC.className = base + (c === "C" ? "text-amber-400 bg-neutral-800 border border-amber-500" : "text-neutral-400 hover:bg-neutral-800");
  }

  function flashScreen() {
    var overlay = document.getElementById("vfxOverlay");
    if (!overlay) return;
    overlay.className = "absolute inset-0 pointer-events-none z-50 bg-red-600/40 transition-none";
    setTimeout(function() {
      overlay.className = "absolute inset-0 pointer-events-none z-50 bg-transparent transition-colors duration-300";
    }, 80);
  }

  function shakeScreen() {
    var novel = document.getElementById("viewNovel");
    if (novel) {
      novel.classList.add("shake-screen");
      setTimeout(function() { novel.classList.remove("shake-screen"); }, 380);
    }
  }

  function showToast(msg) {
    var toast = document.createElement("div");
    toast.className = "fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2.5 bg-neutral-900/95 text-amber-300 text-xs sm:text-sm font-bold rounded-xl border border-amber-500/50 shadow-2xl z-50 flex items-center gap-2 para-in";
    toast.innerHTML = '<span>⚡</span><span>' + msg.replace(/\n/g, '<br>') + '</span>';
    document.body.appendChild(toast);
    setTimeout(function() {
      toast.style.opacity = "0";
      toast.style.transition = "opacity 0.3s";
      setTimeout(function() { toast.remove(); }, 300);
    }, 2800);
  }

  var causalityTimer = null;
  function showCausalityShift(msg, subtext) {
    var banner = document.getElementById("causalityBanner");
    var textEl = document.getElementById("causalityBannerText");
    var novelView = document.getElementById("viewNovel");

    if (textEl && msg) {
      textEl.textContent = msg;
    }
    if (subtext && banner) {
      var subEl = banner.querySelector(".tracking-widest");
      if (subEl) subEl.textContent = subtext;
    }

    // 428式 因果変転シンセサイザー効果音再生
    AudioEngine.play('causality');

    // 画面フラッシュ（サイバーシアン）
    flashScreen('rgba(56, 189, 248, 0.35)', 300);

    // ノベル画面の因果波紋エフェクト
    if (novelView) {
      novelView.classList.remove("causality-ripple-anim");
      void novelView.offsetWidth; // リフロー強制
      novelView.classList.add("causality-ripple-anim");
    }

    // バナー表示とアニメーション
    if (banner) {
      banner.classList.remove("hidden");
      banner.classList.remove("causality-banner-anim");
      void banner.offsetWidth; // リフロー強制
      banner.classList.add("causality-banner-anim");

      if (causalityTimer) clearTimeout(causalityTimer);
      causalityTimer = setTimeout(function() {
        banner.classList.add("hidden");
        banner.classList.remove("causality-banner-anim");
        if (novelView) novelView.classList.remove("causality-ripple-anim");
      }, 3600);
    }
  }

  function openTip(term, clickedEl) {
    AudioEngine.play('tap');
    lastClickedTipTarget = clickedEl || null;
    var tip = (MASTER_DB.tips && MASTER_DB.tips[term]) || (typeof TIPS_MASTER !== "undefined" ? TIPS_MASTER[term] : null);
    if (!tip) return;

    // 既読・アンロック永続化（青 ➔ 黄への進化）
    var state = TimelineState.getState();
    if (!state.unlockedTips) state.unlockedTips = {};
    if (!state.unlockedTips[term]) {
      state.unlockedTips[term] = true;
      TimelineState.saveLocal();
      renderTimeBlockStatus();
      if (term === "オーガスト卿") {
        showToast("💡【TIPS解明】オーガスト卿（立憲主義と統治機構）をアーカイブに記録しました！");
      }
    }
    // 本文内のアンカー色（青/黄/ピンク）を即座に更新
    applyTipLinkStyles();

    var termEl = document.getElementById("tipTermTitle");
    if (termEl) termEl.textContent = tip.term;
    var lawTextEl = document.getElementById("tipLawText");
    if (lawTextEl) lawTextEl.textContent = tip.law;
    var badgeEl = document.getElementById("tipCategoryBadge");
    var isAugustSecret = (term === "オーガスト卿" && TimelineState.hasClearedTrueEnd());
    if (badgeEl) {
      var catName = isAugustSecret ? "🔴 赤字TIPS【極秘追想録】" :
                    tip.category === "freedom" ? "自由権" :
                    tip.category === "equality" ? "平等権" :
                    tip.category === "social" ? "社会権" : "重要判例・統治機構";
      badgeEl.textContent = catName;
      if (isAugustSecret) {
        badgeEl.className = "px-2 py-0.5 rounded text-[10px] font-bold border border-red-500 text-red-300 bg-red-950/80 shadow-[0_0_10px_rgba(239,68,68,0.5)]";
      } else {
        badgeEl.className = "px-2 py-0.5 rounded text-[10px] font-bold border border-sky-500/40 text-sky-300 bg-sky-950/40";
      }
    }
    var descEl = document.getElementById("tipDescription");
    if (descEl) {
      descEl.classList.remove("tip-desc-highlight");
      var parts = tip.desc.split("\n\n");
      descEl.innerHTML = parts.map(function(p) {
        var isAlert = p.indexOf("🔴") !== -1;
        var borderStyle = isAlert ? "border-red-500/60 bg-red-950/40 text-red-200" : "border-neutral-800/80 bg-neutral-950/70 text-neutral-200";
        return '<div class="p-3.5 rounded-xl border leading-relaxed text-xs sm:text-sm ' + borderStyle + '">' + p.replace(/\n/g, '<br>') + '</div>';
      }).join("");

      // ユーザー指示対応：1回クリア（ノーマルクリア等）で裏面史が開示され、真エンドへのモチベーションを高める！
      if (term === "オーガスト卿") {
        if (TimelineState.hasClearedOnce()) {
          var secretBox = document.createElement("div");
          secretBox.className = "p-3.5 rounded-xl border border-red-500/60 bg-red-950/40 text-red-200 leading-relaxed text-xs sm:text-sm mt-3 space-y-2";
          secretBox.innerHTML = '<div class="font-bold text-red-400 flex items-center gap-1.5"><span>🔴</span><span>クリア後特典・統治機構の裏面史</span></div>' +
            '<div>冷酷非道な独裁者の仮面の奥には、かつて平等を掲げ、三十年前の大破局の極限下で「全員を救おうとすれば全員が餓死する」という数理的絶望に直面した男の、身を切るような苦渋の選択が封印されていました。</div>' +
            (TimelineState.hasClearedTrueEnd() ?
              '<div class="text-xs text-amber-300 font-bold pt-1">★ 真エンディング達成により、オーガスト卿自身の手記（極秘追想録）が解放されました。</div>' :
              '<div class="text-xs text-amber-400 font-bold pt-1">🗝️【真エンディングへの手引き】：10:30の時間軸に眠る3つの古遺物をすべて回収して真エンディングを達成すると、彼自身が真実の慟哭を綴った【極秘追想録（外伝シナリオ）】へジャンプできます！</div>');
          descEl.appendChild(secretBox);
        }

        // 真エンドクリア済みの場合はJUMPボタンを追加
        if (TimelineState.hasClearedTrueEnd()) {
          var jumpBtn = document.createElement("button");
          jumpBtn.className = "w-full mt-3 p-3.5 btn-secret-jump btn-canaan-jump rounded-xl text-white font-bold text-xs sm:text-sm flex items-center justify-center gap-2 cursor-pointer shadow-2xl transition-all";
          jumpBtn.innerHTML = '<span class="text-base animate-pulse">🔴</span><span>【極秘追想録へJUMP】オーガスト卿の手記を読む ➔</span>';
          jumpBtn.onclick = function() {
            closeTip();
            closeTipsArchive();
            GameEngine.launchNode("SIDE_AUGUST");
          };
          descEl.appendChild(jumpBtn);
        }
      }
    }

    // 穴埋め選択式クイズの描画（2周目解放・シャッフル再挑戦）
    renderTipQuiz(term);

    var modal = document.getElementById("modalTip");
    if (modal) modal.classList.remove("hidden");
  }

  // 穴埋めクイズのレンダリング
  function renderTipQuiz(term) {
    var quizSec = document.getElementById("tipQuizSection");
    if (!quizSec) return;
    quizSec.innerHTML = "";

    // オーガスト卿専用：クイズではなく手記読了が修得条件（パターンA）
    if (term === "オーガスト卿") {
      var augustBox = document.createElement("div");
      augustBox.className = "tip-quiz-box space-y-3";
      var isAugustMastered = TimelineState.isTipMastered("オーガスト卿");
      if (isAugustMastered) {
        augustBox.innerHTML = 
          '<div class="flex items-center justify-between gap-2 text-pink-400 font-bold text-xs sm:text-sm border-b border-pink-500/30 pb-2">' +
            '<div class="flex items-center gap-1.5"><span>🌸</span><span>【極秘手記読了・完全修得済み（Mastered）】</span></div>' +
            '<span class="text-[10px] px-2 py-0.5 rounded bg-pink-950/80 border border-pink-500 text-pink-300 font-mono">手記読了済</span>' +
          '</div>' +
          '<div class="text-xs sm:text-sm text-neutral-200 leading-relaxed pt-1">' +
            'オーガスト卿の極秘手記『冷酷の仮面の奥で』を読了しました。冷酷な暴君の仮面の下で、全員餓死という絶滅から同胞を救うために耐え抜いた孤独なトリアージの慟哭と真実を完全修得しています。' +
          '</div>';
      } else {
        augustBox.innerHTML = 
          '<div class="flex items-center justify-between gap-2 text-amber-400 font-bold text-xs sm:text-sm border-b border-amber-500/30 pb-2">' +
            '<div class="flex items-center gap-1.5"><span>📜</span><span>【オーガスト卿の修得条件】</span></div>' +
            '<span class="text-[10px] px-2 py-0.5 rounded bg-amber-950/80 border border-amber-500 text-amber-300 font-mono">手記読了で修得</span>' +
          '</div>' +
          '<p class="text-xs text-neutral-300 leading-relaxed pt-1">' +
            'オーガスト卿には条文クイズはありません。真エンディング（13:00）達成後に解放される【極秘手記（シナリオ）】を最後まで読み届けることで、彼の魂を🌸完全修得（桜色）できます。' +
          '</p>';
      }
      quizSec.appendChild(augustBox);
      return;
    }

    var tip = (MASTER_DB.tips && MASTER_DB.tips[term]) || (typeof TIPS_MASTER !== "undefined" ? TIPS_MASTER[term] : null);
    if (!tip || !tip.quiz) return;

    var quiz = tip.quiz;
    var isClearedOnce = TimelineState.hasClearedOnce();
    var isMastered = TimelineState.isTipMastered(term);

    var quizContainer = document.createElement("div");
    quizContainer.className = "tip-quiz-box space-y-3";

    if (!isClearedOnce) {
      // 1周目：2周目クイズ解放の予告
      quizContainer.innerHTML = 
        '<div class="flex items-center gap-2 text-amber-400 font-bold text-xs sm:text-sm">' +
          '<span>🔒</span><span>【憲法修得クイズ・予告】</span>' +
        '</div>' +
        '<p class="text-xs text-neutral-400 leading-relaxed">' +
          '穴埋めクイズはゲームクリア後（2周目以降）に解放されます。正解するとTIPSがピンクに進化し、全条文クイズ制覇＆オーガスト卿の手記読了で特別外伝【俳優座談会】＆【世界観百科事典】が解禁されます！' +
        '</p>';
      quizSec.appendChild(quizContainer);
      return;
    }

    if (isMastered) {
      // 完全修得済み（Mastered）
      quizContainer.innerHTML = 
        '<div class="flex items-center justify-between gap-2 text-pink-400 font-bold text-xs sm:text-sm border-b border-pink-500/30 pb-2">' +
          '<div class="flex items-center gap-1.5"><span>🌸</span><span>【完全修得済み（Mastered）】</span></div>' +
          '<span class="text-[10px] px-2 py-0.5 rounded bg-pink-950/80 border border-pink-500 text-pink-300 font-mono">正解済</span>' +
        '</div>' +
        '<div class="text-xs sm:text-sm text-neutral-200 font-bold leading-relaxed">' + quiz.question + '</div>' +
        '<div class="p-3 rounded-xl bg-pink-950/40 border border-pink-500/50 text-xs sm:text-sm text-pink-200 font-bold">' +
          '✅ 正解：' + quiz.choices[quiz.correctIndex] +
        '</div>' +
        (quiz.explanation ? '<p class="text-xs text-neutral-400 leading-relaxed">' + quiz.explanation + '</p>' : '');
      quizSec.appendChild(quizContainer);
      return;
    }

    // 2周目・未正解：クイズ出題（選択肢シャッフル）
    renderQuizQuestion(quizContainer, term, quiz);
    quizSec.appendChild(quizContainer);
  }

  // クイズ問題文およびシャッフル選択肢の描画
  function renderQuizQuestion(container, term, quiz) {
    container.innerHTML = "";

    var header = document.createElement("div");
    header.className = "flex items-center justify-between gap-2 text-amber-400 font-bold text-xs sm:text-sm border-b border-amber-500/30 pb-2";
    header.innerHTML = '<div class="flex items-center gap-1.5"><span>📝</span><span>【憲法修得 穴埋めクイズ】</span></div>' +
                       '<span class="text-[10px] px-2 py-0.5 rounded bg-amber-950/80 border border-amber-500 text-amber-300 font-mono">2周目挑戦中</span>';
    container.appendChild(header);

    var qText = document.createElement("div");
    qText.className = "text-xs sm:text-sm text-neutral-200 font-bold leading-relaxed pt-1";
    qText.textContent = quiz.question;
    container.appendChild(qText);

    // 選択肢のシャッフル（Fisher-Yates）
    var choiceObjs = quiz.choices.map(function(cText, idx) {
      return { text: cText, isCorrect: (idx === quiz.correctIndex) };
    });
    for (var i = choiceObjs.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = choiceObjs[i];
      choiceObjs[i] = choiceObjs[j];
      choiceObjs[j] = temp;
    }

    var choicesList = document.createElement("div");
    choicesList.className = "space-y-2 pt-1";

    choiceObjs.forEach(function(item, cIdx) {
      var btn = document.createElement("button");
      btn.className = "tip-quiz-choice-btn";
      btn.innerHTML = '<span class="w-5 h-5 rounded-full bg-neutral-800 flex items-center justify-center text-[10px] font-mono text-neutral-400">' + (cIdx + 1) + '</span>' +
                      '<span>' + item.text + '</span>';

      btn.onclick = function() {
        var allBtns = choicesList.querySelectorAll("button");
        allBtns.forEach(function(b) { b.disabled = true; });

        if (item.isCorrect) {
          AudioEngine.play('sparkle');
          btn.classList.add("correct-choice");
          TimelineState.markTipMastered(term);
          applyTipLinkStyles(); // 本文の即時ピンク化

          var resultBox = document.createElement("div");
          resultBox.className = "p-3 rounded-xl bg-pink-950/40 border border-pink-500/60 text-xs sm:text-sm text-pink-200 space-y-2 mt-3 animate-fade-in";
          resultBox.innerHTML = '<div class="font-bold text-pink-300 flex items-center gap-1.5"><span>🌸</span><span>正解！ 憲法条文の知恵を完全修得しました！</span></div>' +
                                '<p class="text-neutral-300">' + (quiz.explanation || '') + '</p>';
          container.appendChild(resultBox);

          if (TimelineState.hasMasteredAllTips()) {
            var allMasterBox = document.createElement("div");
            allMasterBox.className = "p-3.5 rounded-xl border-2 border-amber-500 bg-gradient-to-r from-amber-950/80 to-neutral-900 text-amber-200 space-y-1.5 mt-3 shadow-2xl";
            allMasterBox.innerHTML = '<div class="font-black text-amber-300 text-sm flex items-center gap-2"><span>🌟</span><span>【全TIPS完全修得達成！！】</span></div>' +
                                      '<div class="text-xs leading-relaxed">全ての憲法条文・知恵の穴埋めクイズを完全制覇しました！ 判例図鑑アーカイブにて特別ボーナス【俳優たちの座談会ノベル】＆【ネオ・ジャパニア百科事典】が解禁されました！</div>';
            container.appendChild(allMasterBox);
          }
        } else {
          AudioEngine.play('thunder');
          btn.classList.add("wrong-choice");

          var descContainer = document.getElementById("tipDescription");
          if (descContainer) {
            descContainer.classList.add("tip-desc-highlight");
          }

          var wrongBox = document.createElement("div");
          wrongBox.className = "p-3 rounded-xl bg-red-950/40 border border-red-500/60 text-xs sm:text-sm text-red-200 space-y-2 mt-3 animate-fade-in";
          wrongBox.innerHTML = '<div class="font-bold text-red-300 flex items-center gap-1.5"><span>❌</span><span>不正解！ 上の解説文をもう一度読み直そう</span></div>' +
                               '<p class="text-neutral-400 text-xs">解説文の中に正解のヒントが書かれています。読み直したら、再挑戦ボタンを押してください。</p>';

          var retryBtn = document.createElement("button");
          retryBtn.className = "w-full py-2.5 px-4 rounded-xl bg-amber-600 hover:bg-amber-500 text-neutral-950 font-black text-xs transition-all shadow-md cursor-pointer flex items-center justify-center gap-2";
          retryBtn.innerHTML = '<span>🔄</span><span>解説を読み直して再挑戦（選択肢をシャッフル）</span>';
          retryBtn.onclick = function() {
            AudioEngine.play('tap');
            if (descContainer) {
              descContainer.classList.remove("tip-desc-highlight");
            }
            renderQuizQuestion(container, term, quiz);
          };
          wrongBox.appendChild(retryBtn);
          container.appendChild(wrongBox);
        }
      };

      choicesList.appendChild(btn);
    });

    container.appendChild(choicesList);
  }

  // 本文中のTIPSアンカー色（未読:青 / 既読:黄 / 正解:ピンク / オーガスト赤）の一括適用
  function applyTipLinkStyles(container) {
    var root = container || document.getElementById("paragraphsList");
    if (!root) return;
    var links = root.querySelectorAll(".tip-link");
    var state = TimelineState.getState();
    var isTrueCleared = TimelineState.hasClearedTrueEnd();

    for (var i = 0; i < links.length; i++) {
      var el = links[i];
      var term = el.getAttribute("data-tip");
      if (!term) continue;

      if (isTrueCleared && term === "オーガスト卿") {
        el.classList.remove("tip-yellow", "tip-pink");
        el.classList.add("tip-link-red");
      } else if (TimelineState.isTipMastered(term)) {
        el.classList.remove("tip-yellow", "tip-link-red");
        el.classList.add("tip-pink");
      } else if (state.unlockedTips && state.unlockedTips[term]) {
        el.classList.remove("tip-pink", "tip-link-red");
        el.classList.add("tip-yellow");
      } else {
        el.classList.remove("tip-yellow", "tip-pink", "tip-link-red");
      }
    }
  }

  function closeTip() {
    AudioEngine.play('tap');
    var modal = document.getElementById("modalTip");
    if (modal) modal.classList.add("hidden");
    tipCooldownUntil = Date.now() + 350; // 350msのタップ貫通ガード

    // ハイライトのリセット
    var descContainer = document.getElementById("tipDescription");
    if (descContainer) {
      descContainer.classList.remove("tip-desc-highlight");
    }

    if (lastClickedTipTarget) {
      try {
        lastClickedTipTarget.classList.remove("tip-link-focused");
        void lastClickedTipTarget.offsetWidth; // リフロー強制でアニメーション再起動
        lastClickedTipTarget.classList.add("tip-link-focused");
      } catch (e) {}
      lastClickedTipTarget = null;
    }
  }

  function isTipCooldown() {
    return Date.now() < tipCooldownUntil;
  }

  function openWikiArchive() {
    AudioEngine.play('tap');
    var modal = document.getElementById("modalWikiArchive");
    if (modal) modal.classList.remove("hidden");

  // 428 神演出：因果解放・ロック粉砕チェック
  function checkAndPlayUnlockAnimation() {
    var state = TimelineState.getState();
    if (!state) return;

    // 1. エレナのロック解除判定（レンが水門KEEP OUTまたは到達し、かつ未再生の場合）
    var isRenTriggered = (
      state.visitedNodes.indexOf("A_1045_WATERGATE") !== -1 ||
      state.visitedNodes.indexOf("KEEP_OUT_A1") !== -1 ||
      state.visitedNodes.indexOf("A_1100") !== -1
    );
    if (isRenTriggered && !state.seenUnlockAnim_B) {
      playUnlockAnimation("B");
      return;
    }

    // 2. ダニエルのロック解除判定（エレナがBAD_10密告者の波紋に直面し、かつ未再生の場合）
    var isDanielTriggered = (
      Boolean(state.unlockedEndings && state.unlockedEndings["BAD_10"]) ||
      state.visitedNodes.indexOf("BAD_10") !== -1
    );
    if (isDanielTriggered && !state.seenUnlockAnim_C) {
      playUnlockAnimation("C");
      return;
    }
  }

  // 428 神演出：ロック粉砕＆アンロックエナジーパルス発動
  function playUnlockAnimation(charKey) {
    var state = TimelineState.getState();
    var overlayId = charKey === "B" ? "lockOverlayB" : charKey === "C" ? "lockOverlayC" : null;
    var cardId = charKey === "B" ? "cardCharB" : charKey === "C" ? "cardCharC" : null;
    if (!overlayId || !cardId) return;

    var overlay = document.getElementById(overlayId);
    var card = document.getElementById(cardId);
    if (!overlay || !card) return;

    // ロックオーバーレイを一時可視化し、粉砕アニメーションを発動
    overlay.classList.remove("hidden");
    overlay.classList.add("lock-shatter-anim");

    // 重低音インパクト + 煌めきファンファーレ
    AudioEngine.play('heavy');
    setTimeout(function() {
      AudioEngine.play('sparkle');
    }, 250);

    // 画面全体への白光フラッシュ
    flashScreen();

    // 告知バナーの表示
    var bannerContainer = document.getElementById("unlockNotificationContainer");
    if (!bannerContainer) {
      bannerContainer = document.createElement("div");
      bannerContainer.id = "unlockNotificationContainer";
      bannerContainer.className = "fixed top-12 sm:top-14 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-11/12 max-w-lg";
      document.body.appendChild(bannerContainer);
    }

    var bannerText = charKey === "B"
      ? "🔓 因果接続：レンの足掻きにより【エレナ（平等権）】の運命が解放された！"
      : "🔓 因果接続：密告通報の悲劇（BAD_10）を回避するため【ダニエル（社会権）】の運命が解放された！";
    var bannerColor = charKey === "B"
      ? "bg-sky-950/95 border-sky-400 text-sky-200 shadow-sky-900/60"
      : "bg-amber-950/95 border-amber-400 text-amber-200 shadow-amber-900/60";

    bannerContainer.innerHTML =
      '<div class="unlock-banner-anim ' + bannerColor + ' border-2 px-4 py-3 rounded-2xl shadow-2xl flex items-center justify-center gap-2.5 backdrop-blur-md">' +
      '<span class="text-xl">⚡</span>' +
      '<span class="font-black text-xs sm:text-sm tracking-wide">' + bannerText + '</span>' +
      '</div>';

    // 1.1秒後にオーバーレイを完全消去し、カードにエナジーパルスを付与
    setTimeout(function() {
      overlay.classList.add("hidden");
      overlay.classList.remove("lock-shatter-anim");
      card.classList.add(charKey === "B" ? "card-unlocked-glow-sky" : "card-unlocked-glow-amber");

      if (charKey === "B") state.seenUnlockAnim_B = true;
      if (charKey === "C") state.seenUnlockAnim_C = true;
      TimelineState.saveLocal();
    }, 1100);

    // 4.5秒後にバナーを自動消去
    setTimeout(function() {
      if (bannerContainer) bannerContainer.innerHTML = "";
    }, 4500);
  }

// 憲法マスター検定クイズコントローラー
var QuizController = (function() {
  var quizQuestions = [];
  var currentIndex = 0;
  var isAnswering = false;

  function init() {
    var btnClose = document.getElementById("btnCloseQuiz");
    if (btnClose) {
      btnClose.onclick = function() {
        AudioEngine.play('tap');
        closeQuiz();
      };
    }
    var btnStart = document.getElementById("btnStartTipsQuiz");
    if (btnStart) {
      btnStart.onclick = function() {
        startQuiz();
      };
    }
  }

  function getQuestions() {
    if (typeof window !== "undefined" && window.TIPS_QUIZ_QUESTIONS && window.TIPS_QUIZ_QUESTIONS.length > 0) {
      return window.TIPS_QUIZ_QUESTIONS;
    }
    if (typeof TIPS_QUIZ_QUESTIONS !== "undefined" && TIPS_QUIZ_QUESTIONS.length > 0) {
      return TIPS_QUIZ_QUESTIONS;
    }
    return [];
  }

  function startQuiz() {
    AudioEngine.play('chime');
    quizQuestions = getQuestions();
    currentIndex = 0;
    isAnswering = false;

    var totalCountEl = document.getElementById("quizTotalCount");
    if (totalCountEl) totalCountEl.textContent = quizQuestions.length;

    var modal = document.getElementById("modalQuiz");
    if (modal) modal.classList.remove("hidden");
    renderCurrentQuestion();
  }

  function closeQuiz() {
    AudioEngine.play('tap');
    var modal = document.getElementById("modalQuiz");
    if (modal) modal.classList.add("hidden");
  }

  function renderCurrentQuestion() {
    var q = quizQuestions[currentIndex];
    if (!q) return;

    isAnswering = false;
    var idxEl = document.getElementById("quizCurrentIndex");
    if (idxEl) idxEl.textContent = currentIndex + 1;

    var catEl = document.getElementById("quizCategoryBadge");
    if (catEl) catEl.textContent = q.category;

    var textEl = document.getElementById("quizQuestionText");
    if (textEl) textEl.textContent = q.question;

    var feedbackBox = document.getElementById("quizFeedbackBox");
    if (feedbackBox) {
      feedbackBox.classList.add("hidden");
      feedbackBox.innerHTML = "";
    }

    var choicesCont = document.getElementById("quizChoicesContainer");
    if (!choicesCont) return;
    choicesCont.innerHTML = "";

    q.choices.forEach(function(choiceText, idx) {
      var btn = document.createElement("button");
      btn.className = "w-full p-3.5 sm:p-4 rounded-xl border border-neutral-700 bg-neutral-800/80 hover:bg-neutral-700/90 text-left text-xs sm:text-sm font-hud text-neutral-200 transition-all flex items-center justify-between gap-2 cursor-pointer shadow-md";
      btn.innerHTML = '<span class="flex items-center gap-2.5"><span>' + ['①', '②', '③'][idx] + '</span><span>' + choiceText + '</span></span>' +
                       '<span class="text-neutral-500 text-xs shrink-0">選択 ▶</span>';

      btn.onclick = function() {
        if (isAnswering) return;
        isAnswering = true;
        handleAnswer(idx);
      };

      choicesCont.appendChild(btn);
    });
  }

  function handleAnswer(selectedIdx) {
    var q = quizQuestions[currentIndex];
    var isCorrect = (selectedIdx === q.correctIndex);
    var feedbackBox = document.getElementById("quizFeedbackBox");
    if (!feedbackBox) return;

    feedbackBox.classList.remove("hidden");

    if (isCorrect) {
      AudioEngine.play('chime');
      feedbackBox.className = "p-4 rounded-xl border border-emerald-500/70 bg-emerald-950/40 text-xs font-hud space-y-2 text-emerald-200 shadow-lg";
      feedbackBox.innerHTML = '<div>' +
        '<div class="font-black text-emerald-400 text-sm flex items-center gap-1.5"><span>⭕</span><span>正 解 ！</span></div>' +
        '<p class="mt-1 text-neutral-300 leading-relaxed font-sans-jp">' + q.explanation + '</p>' +
        '</div>' +
        '<div class="pt-2 text-right">' +
        '<button id="btnQuizNextAction" class="px-4 py-2 bg-gradient-to-r from-emerald-500 to-emerald-400 hover:from-emerald-400 text-neutral-950 font-black text-xs rounded-lg shadow cursor-pointer font-hud transition-transform active:scale-95">' +
        (currentIndex + 1 < quizQuestions.length ? '次の問題へ進む ▶' : '🏆 全問合格！ 修了証書を受け取る ▶') +
        '</button>' +
        '</div>';

      var nextBtn = document.getElementById("btnQuizNextAction");
      if (nextBtn) {
        nextBtn.onclick = function() {
          AudioEngine.play('tap');
          if (currentIndex + 1 < quizQuestions.length) {
            currentIndex++;
            renderCurrentQuestion();
          } else {
            // 全問合格処理
            closeQuiz();
            TimelineState.unlockTrophy('quizMaster');
            CertRenderer.openModal('quizMaster');
          }
        };
      }
    } else {
      AudioEngine.play('bad');
      feedbackBox.className = "p-4 rounded-xl border border-rose-500/70 bg-rose-950/40 text-xs font-hud space-y-2 text-rose-200 shadow-lg";
      feedbackBox.innerHTML = '<div>' +
        '<div class="font-black text-rose-400 text-sm flex items-center gap-1.5"><span>❌</span><span>不 正 解 ……</span></div>' +
        '<p class="mt-1 text-neutral-300 leading-relaxed font-sans-jp">もう一度条文と判例の解説を振り返り、再挑戦してください。</p>' +
        '</div>' +
        '<div class="pt-2 text-right">' +
        '<button id="btnQuizRetryAction" class="px-4 py-2 bg-rose-800 hover:bg-rose-700 text-white font-bold text-xs rounded-lg shadow cursor-pointer font-hud transition-transform active:scale-95">もう一度解き直す 🔄</button>' +
        '</div>';

      var retryBtn = document.getElementById("btnQuizRetryAction");
      if (retryBtn) {
        retryBtn.onclick = function() {
          AudioEngine.play('tap');
          renderCurrentQuestion();
        };
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  return {
    startQuiz: startQuiz,
    closeQuiz: closeQuiz
  };
})();

    var ctx = canvas.getContext("2d");
    var state = TimelineState.getState();

    var w = 1200;
    var h = 840;
    canvas.width = w;
    canvas.height = h;

    // 背景グラデーション
    var bgGrad = ctx.createLinearGradient(0, 0, w, h);
    bgGrad.addColorStop(0, spec.bgGradient[0]);
    bgGrad.addColorStop(0.5, spec.bgGradient[1]);
    bgGrad.addColorStop(1, spec.bgGradient[2]);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, w, h);

    // 金枠外枠（太さ 6px）
    ctx.strokeStyle = "#eab308";
    ctx.lineWidth = 6;
    ctx.strokeRect(30, 30, w - 60, h - 60);

    // 金枠内枠（余白10px、太さ 2px）
    ctx.strokeStyle = "rgba(234, 179, 8, 0.45)";
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 40, w - 80, h - 80);

    // 四隅のコーナー装飾
    ctx.strokeStyle = "#eab308";
    ctx.lineWidth = 3;
    var cornerSize = 25;
    // 左上
    ctx.strokeRect(45, 45, cornerSize, cornerSize);
    // 右上
    ctx.strokeRect(w - 45 - cornerSize, 45, cornerSize, cornerSize);
    // 左下
    ctx.strokeRect(45, h - 45 - cornerSize, cornerSize, cornerSize);
    // 右下
    ctx.strokeRect(w - 45 - cornerSize, h - 45 - cornerSize, cornerSize, cornerSize);

    // メインタイトル
    ctx.fillStyle = "#fde047";
    ctx.font = "bold 44px 'Shippori Mincho', serif";
    ctx.textAlign = "center";
    ctx.fillText(spec.mainTitle, w / 2, 120);

    ctx.font = "bold 32px 'Zen Kaku Gothic New', sans-serif";
    ctx.fillText((state.studentName || "探究者") + " 殿", w / 2, 240);

    // 本文（4行）
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "20px 'Shippori Mincho', serif";
    spec.lines.forEach(function(line, idx) {
      ctx.fillText(line, w / 2, 320 + (idx * 40));
    });

    // 実績
    ctx.fillStyle = "#38bdf8";
    ctx.font = "bold 22px 'Zen Kaku Gothic New', sans-serif";
    ctx.fillText("【達成実績】 " + spec.achievement, w / 2, 530);

    // 日付・発行者
    var today = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });

    ctx.font = "18px 'Zen Kaku Gothic New', sans-serif";
    ctx.fillText(today, w / 2, 640);

    ctx.fillStyle = "#eab308";
    ctx.font = "bold 22px 'Shippori Mincho', serif";
    ctx.fillText("パラレル・ジャパニア憲法探究委員会", w / 2, 700);

// ============================================================================
// 【管制柱】教員用管制コックピット＆リアルタイムダッシュボード コントローラー
// ============================================================================
var TeacherDashboard = (function() {
  var cachedStudents = [];
  var currentFilter = "all";
  var currentKeyword = "";

  var autoRefreshInterval = 10000; // 10秒間隔
  var autoRefreshTimer = null;
  var isAutoRefreshOn = true;
  var isTeacherMode = false;

  function open() {
    var modal = document.getElementById("modalTeacherDashboard");
    if (!modal) return;
    modal.classList.remove("hidden");
    enableTeacherMode();
    loadData(false);
    startAutoRefresh();
  }

  function close() {
    var modal = document.getElementById("modalTeacherDashboard");
    if (modal) modal.classList.add("hidden");
    stopAutoRefresh();
  }

  function enableTeacherMode() {
    isTeacherMode = true;
    var btnMenuAdmin = document.getElementById("btnGoTeacherDashboard");
    if (btnMenuAdmin) btnMenuAdmin.classList.remove("hidden");
    var bannerAdmin = document.getElementById("bannerTeacherMode");
    if (bannerAdmin) bannerAdmin.classList.remove("hidden");
  }

  function startAutoRefresh() {
    stopAutoRefresh();
    if (!isAutoRefreshOn) return;
    autoRefreshTimer = setInterval(function() {
      // 検索バーに入力フォーカスがある最中は更新を一時スキップ（入力邪魔防止）
      var searchInput = document.getElementById("dashSearchInput");
      if (searchInput && document.activeElement === searchInput) return;
      loadData(true); // 静かにバックグラウンド更新
    }, autoRefreshInterval);
  }

  function stopAutoRefresh() {
    if (autoRefreshTimer) {
      clearInterval(autoRefreshTimer);
      autoRefreshTimer = null;
    }
  }

  function toggleAutoRefresh() {
    isAutoRefreshOn = !isAutoRefreshOn;
    var dot = document.getElementById("autoRefreshDot");
    var text = document.getElementById("autoRefreshText");
    if (isAutoRefreshOn) {
      if (dot) dot.className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
      if (text) text.textContent = "自動更新: 10秒";
      startAutoRefresh();
      UIController.showToast("🔄 ダッシュボードの自動更新を【10秒】で開始しました。");
    } else {
      if (dot) dot.className = "w-2 h-2 rounded-full bg-neutral-600";
      if (text) text.textContent = "自動更新: OFF";
      stopAutoRefresh();
      UIController.showToast("⏸️ ダッシュボードの自動更新を停止しました。");
    }
  }

  function loadData(isSilent) {
    var loading = document.getElementById("dashLoadingNotice");
    var grid = document.getElementById("dashStudentGrid");
    var empty = document.getElementById("dashEmptyNotice");
    if (!isSilent) {
      if (loading) loading.classList.remove("hidden");
      if (grid) grid.classList.add("hidden");
      if (empty) empty.classList.add("hidden");
    }

    if (typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === "success") {
            renderDashboard(res);
          } else {
            if (!isSilent) UIController.showToast("⚠️ データ取得に失敗しました: " + (res ? res.message : "不明なエラー"));
            if (loading) loading.classList.add("hidden");
          }
        })
        .withFailureHandler(function(err) {
          if (!isSilent) UIController.showToast("⚠️ 通信エラー: " + err);
          if (loading) loading.classList.add("hidden");
        })
        .getTeacherDashboardData("9999");
    } else {
      // ローカルプレビュー環境用：リアルなクラス40名モックシミュレーション
      setTimeout(function() {
        var mockData = generateMockClassData();
        renderDashboard(mockData);
      }, isSilent ? 0 : 300);
    }
  }

  function generateMockClassData() {
    var sampleNames = [
      "ササキ アツシ", "サトウ レン", "スズキ エレナ", "タナカ ダニエル", "ワタナベ シン",
      "イトウ マーサ", "ナカムラ ゴードン", "コバヤシ エマ", "カトウ ヨシト", "ヨシダ サクラ",
      "ヤマダ タロウ", "ササキ ハナコ", "ヤマグチ カズヤ", "マツモト ユウキ", "イノウエ カレン",
      "キムラ ソラ", "ハヤシ タイキ", "シミズ ミオ", "ヤマザキ ハルト", "イケダ ユイ",
      "アベ リュウセイ", "ハシモト アヤカ", "モリ ヒナタ", "イシカワ コウキ", "ナカジマ リコ",
      "マエダ アスカ", "フジタ リク", "オガワ メイ", "ゴトウ レオ", "ムラカミ リン"
    ];
    var students = [];
    var badEndStats = { "BAD_02": 4, "BAD_01": 2, "BAD_10": 3 };
    var now = new Date();

    sampleNames.forEach(function(name, i) {
      var isSos = (i === 1 || i === 6 || i === 12);
      var isClear = (i === 0 || i === 4);
      var char = ["A: レン", "B: エレナ", "C: ダニエル"][i % 3];
      var scene = isSos ? "BAD_02 濁流への水葬" : (isClear ? "13:00 新世紀憲法" : "11:15 街頭ビジョン");
      var node = isSos ? "BAD_02" : (isClear ? "TRUE_SECRET_END" : "A_1115");
      students.push({
        name: name,
        passcode: String(1000 + i * 137).substring(0, 4),
        currentChar: char,
        sceneTitle: scene,
        currentNodeKey: node,
        progressText: (i * 2) + " / 28 結末",
        badEndCount: isSos ? 3 : (i % 2),
        masteredCount: isClear ? 10 : (i % 6),
        isCleared: isClear,
        isSos: isSos,
        lastUpdatedFormatted: "13:" + (20 + (i % 10)) + ":00"
      });
    });

    return {
      status: "success",
      students: students,
      summary: {
        total: students.length,
        sosCount: 3,
        trueEndAchieved: 2,
        totalTipsMastered: 86,
        badEndStats: badEndStats
      }
    };
  }

  function renderDashboard(res) {
    cachedStudents = res.students || [];
    var sum = res.summary || {};

    // 統計サマリー更新
    var elTotal = document.getElementById("dashTotalStudents");
    if (elTotal) elTotal.textContent = sum.total || cachedStudents.length;
    var elSos = document.getElementById("dashSosCount");
    if (elSos) elSos.textContent = sum.sosCount || 0;
    var elMaster = document.getElementById("dashTotalMastered");
    if (elMaster) elMaster.textContent = sum.totalTipsMastered || 0;
    var elClear = document.getElementById("dashTrueEndCount");
    if (elClear) elClear.textContent = sum.trueEndAchieved || 0;

    applyFilterAndRender();
  }

  function applyFilterAndRender() {
    var loading = document.getElementById("dashLoadingNotice");
    var grid = document.getElementById("dashStudentGrid");
    var empty = document.getElementById("dashEmptyNotice");
    if (loading) loading.classList.add("hidden");

    var filtered = cachedStudents.filter(function(st) {
      if (currentFilter === "sos" && !st.isSos) return false;
      if (currentFilter === "clear" && !st.isCleared) return false;
      if (currentKeyword) {
        var kw = currentKeyword.toLowerCase();
        var matchName = (st.name || "").toLowerCase().indexOf(kw) !== -1;
        var matchPass = (st.passcode || "").indexOf(kw) !== -1;
        if (!matchName && !matchPass) return false;
      }
      return true;
    });

    if (filtered.length === 0) {
      if (grid) grid.classList.add("hidden");
      if (empty) empty.classList.remove("hidden");
      return;
    }

    if (empty) empty.classList.add("hidden");
    if (grid) {
      grid.classList.remove("hidden");
      grid.innerHTML = "";

      filtered.forEach(function(st) {
        var card = document.createElement("div");
        var borderClass = st.isSos
          ? "border-rose-500/80 bg-rose-950/20 shadow-[0_0_12px_rgba(244,63,94,0.3)] animate-pulse"
          : (st.isCleared
            ? "border-amber-400/80 bg-amber-950/20 shadow-[0_0_10px_rgba(251,191,36,0.2)]"
            : "border-neutral-800 bg-neutral-900/90 hover:border-neutral-700");

        card.className = "p-3.5 rounded-xl border transition-all space-y-2 text-left " + borderClass;

        var statusBadge = st.isSos
          ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-black bg-rose-500 text-neutral-950">⚠️ SOS停滞</span>'
          : (st.isCleared
            ? '<span class="px-1.5 py-0.5 rounded text-[10px] font-black bg-amber-400 text-neutral-950">🏆 完走制覇</span>'
            : '<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-neutral-800 text-emerald-400 border border-emerald-900">▶ 進行中</span>');

        var adviceHtml = "";
        if (st.isSos) {
          adviceHtml = '<div class="mt-2 p-2 rounded-lg bg-rose-900/40 border border-rose-800/80 text-[10px] text-rose-200">' +
            '💡 <strong>指導指針:</strong> BAD END停滞中。別時間軸の選択肢（ダニエルの水門・配電）を見直すよう声かけしてください。' +
            '</div>';
        }

        card.innerHTML =
          '<div class="flex justify-between items-start gap-1">' +
            '<div>' +
              '<div class="text-xs font-black text-white">' + escapeHtml(st.name) + '</div>' +
              '<div class="text-[11px] font-mono text-amber-300 font-bold tracking-widest mt-0.5">PASS: ' + escapeHtml(st.passcode) + '</div>' +
            '</div>' +
            '<div>' + statusBadge + '</div>' +
          '</div>' +
          '<div class="pt-1 border-t border-neutral-800/80 text-[11px] space-y-1">' +
            '<div class="flex items-center justify-between text-neutral-300">' +
              '<span class="font-bold text-neutral-400">現在地:</span>' +
              '<span class="truncate max-w-[130px] font-mono text-sky-300" title="' + escapeHtml(st.sceneTitle) + '">' + escapeHtml(st.sceneTitle || st.currentNodeKey) + '</span>' +
            '</div>' +
            '<div class="flex items-center justify-between text-neutral-400">' +
              '<span>🌸 TIPS正解: <strong class="text-pink-400">' + st.masteredCount + '</strong>問</span>' +
              '<span>💀 被弾: <strong class="text-neutral-300">' + st.badEndCount + '</strong>回</span>' +
            '</div>' +
            '<div class="text-[10px] text-neutral-500 text-right font-mono">更新: ' + escapeHtml(st.lastUpdatedFormatted || "--:--") + '</div>' +
          '</div>' +
          adviceHtml;

        grid.appendChild(card);
      });
    }
  }

  function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/[&<>"']/g, function(m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function init() {
    var btnClose = document.getElementById("btnCloseTeacherDashboard");
    if (btnClose) btnClose.onclick = close;

    var btnRefresh = document.getElementById("btnRefreshTeacherDashboard");
    if (btnRefresh) {
      btnRefresh.onclick = function() {
        AudioEngine.play('tap');
        loadData(false);
      };
    }

    var btnAutoRef = document.getElementById("btnToggleAutoRefresh");
    if (btnAutoRef) {
      btnAutoRef.onclick = function() {
        AudioEngine.play('tap');
        toggleAutoRefresh();
      };
    }

    var btnPlay = document.getElementById("btnTeacherTestPlay");
    if (btnPlay) {
      btnPlay.onclick = function() {
        AudioEngine.play('tap');
        enableTeacherMode();
        close();
        if (typeof displayCharSelect === "function") {
          displayCharSelect();
        }
      };
    }

    var btnMenuAdmin = document.getElementById("btnGoTeacherDashboard");
    if (btnMenuAdmin) {
      btnMenuAdmin.onclick = function() {
        AudioEngine.play('tap');
        var floatMenu = document.getElementById("headerFloatingMenu");
        if (floatMenu) floatMenu.classList.add("hidden");
        open();
      };
    }

    var btnBannerAdmin = document.getElementById("btnBannerToTeacher");
    if (btnBannerAdmin) {
      btnBannerAdmin.onclick = function() {
        AudioEngine.play('tap');
        open();
      };
    }

    var searchInput = document.getElementById("dashSearchInput");
    if (searchInput) {
      searchInput.oninput = function() {
        currentKeyword = searchInput.value.trim();
        applyFilterAndRender();
      };
    }

    var filterBtns = document.querySelectorAll(".dash-filter-btn");
    filterBtns.forEach(function(btn) {
      btn.onclick = function() {
        AudioEngine.play('tap');
        filterBtns.forEach(function(b) {
          b.className = "dash-filter-btn px-3 py-1.5 rounded-lg font-bold bg-neutral-800 text-neutral-300 hover:text-white border border-neutral-700 transition-all cursor-pointer";
        });
        btn.className = "dash-filter-btn px-3 py-1.5 rounded-lg font-bold bg-amber-500 text-neutral-950 border border-amber-400 transition-all cursor-pointer";
        currentFilter = btn.getAttribute("data-filter") || "all";
        applyFilterAndRender();
      };
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

  return {
    open: open,
    close: close,
    refresh: loadData
  };
})();

  function isUnlocked() {
    var state = (typeof TimelineState !== "undefined") ? TimelineState.getState() : null;
    if (!state) return false;
    var slots = state.slots || {};
    var visited = state.visitedNodes || [];
    var endings = state.unlockedEndings || {};
    return Boolean(
      slots["BONUS_TAWAKICHI_CLEARED"] === "CLEARED" ||
      visited.indexOf("BONUS_TAWAKICHI") !== -1 ||
      endings["BONUS_TAWAKICHI"]
    );
  }

  function checkUnlockStatus() {
    var unlocked = isUnlocked();
    var btnHeader = document.getElementById("btnSoundtrack");
    if (btnHeader) {
      btnHeader.classList.toggle("hidden", !unlocked);
    }
    var btnCockpit = document.getElementById("btnCockpitSoundtrack");
    if (btnCockpit) {
      btnCockpit.classList.toggle("hidden", !unlocked);
    }
    return unlocked;
  }

  function switchTab(tab) {
    if (currentTab === tab) return;
    currentTab = tab;
    var tabBgm = document.getElementById("tabSoundtrackBGM");
    var tabSe = document.getElementById("tabSoundtrackSE");
    if (tabBgm && tabSe) {
      if (currentTab === "bgm") {
        tabBgm.className = "px-4 py-2 text-xs font-black rounded-t-xl border-t border-x border-amber-500/80 bg-neutral-900 text-amber-300 flex items-center gap-1.5 transition-all cursor-pointer";
        tabSe.className = "px-4 py-2 text-xs font-bold rounded-t-xl border-t border-x border-transparent bg-transparent hover:bg-neutral-900/60 text-neutral-400 hover:text-neutral-200 flex items-center gap-1.5 transition-all cursor-pointer";
      } else {
        tabSe.className = "px-4 py-2 text-xs font-black rounded-t-xl border-t border-x border-amber-500/80 bg-neutral-900 text-amber-300 flex items-center gap-1.5 transition-all cursor-pointer";
        tabBgm.className = "px-4 py-2 text-xs font-bold rounded-t-xl border-t border-x border-transparent bg-transparent hover:bg-neutral-900/60 text-neutral-400 hover:text-neutral-200 flex items-center gap-1.5 transition-all cursor-pointer";
      }
    }
    render();
    if (typeof AudioEngine !== "undefined" && AudioEngine.play) {
      AudioEngine.play('tap');
    }
  }

  function renderBGMList(container, currentKey) {
    TRACK_DEFS.forEach(function(track) {
      var isPlaying = (track.key === currentKey);
      var card = document.createElement("div");
      card.className = "p-3.5 sm:p-4 rounded-2xl border transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 " +
        (isPlaying
          ? "bg-amber-950/40 border-amber-400 shadow-[0_0_20px_rgba(245,158,11,0.25)]"
          : "bg-neutral-950/70 border-neutral-800 hover:border-neutral-700");

      var left = document.createElement("div");
      left.className = "flex items-start gap-3 min-w-0 flex-1";

      var iconEl = document.createElement("div");
      iconEl.className = "w-10 h-10 rounded-xl bg-neutral-900 border " + (isPlaying ? "border-amber-400 text-amber-300 animate-pulse" : "border-neutral-700 text-neutral-300") +
        " flex items-center justify-center text-xl shrink-0";
      iconEl.textContent = track.icon;

      var textWrap = document.createElement("div");
      textWrap.className = "space-y-0.5 min-w-0";

      var tagLine = document.createElement("div");
      tagLine.className = "flex items-center gap-1.5 text-[9px] font-mono";
      tagLine.innerHTML = '<span class="px-1.5 py-0.5 rounded bg-neutral-900 border border-neutral-700 font-bold text-amber-400">' + track.tag + '</span>' +
        '<span class="text-neutral-400">' + track.bpm + '</span>';

      var titleEl = document.createElement("div");
      titleEl.className = "font-black text-sm text-white font-hud " + (isPlaying ? "text-amber-300" : "");
      titleEl.textContent = track.title;

      var descEl = document.createElement("div");
      descEl.className = "text-[11px] text-neutral-400 line-clamp-2 leading-relaxed";
      descEl.textContent = track.desc;

      textWrap.appendChild(tagLine);
      textWrap.appendChild(titleEl);
      textWrap.appendChild(descEl);
      left.appendChild(iconEl);
      left.appendChild(textWrap);

      var right = document.createElement("div");
      right.className = "w-full sm:w-auto shrink-0 pt-1 sm:pt-0";

      var playBtn = document.createElement("button");
      playBtn.className = "w-full sm:w-auto px-4 py-2 rounded-xl font-black text-xs transition-all flex items-center justify-center gap-1.5 cursor-pointer " +
        (isPlaying
          ? "bg-amber-400 text-neutral-950 shadow-md font-hud animate-pulse"
          : "bg-neutral-800 hover:bg-neutral-700 text-neutral-200 border border-neutral-700");
      playBtn.innerHTML = isPlaying ? '<span>▶ 演奏中</span><span class="text-[10px]">ılı</span>' : '<span>▶ 演奏する</span>';

      playBtn.onclick = function() {
        if (typeof AudioEngine !== "undefined" && AudioEngine.playBGM) {
          AudioEngine.playBGM(track.key);
          render();
        }
      };

      right.appendChild(playBtn);
      card.appendChild(left);
      card.appendChild(right);
      container.appendChild(card);
    });
  }

  function renderSEList(container) {
    SE_DEFS.forEach(function(se) {
      var card = document.createElement("div");
      card.className = "p-3.5 sm:p-4 rounded-2xl border transition-all flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-neutral-950/70 border-neutral-800 hover:border-neutral-700";

      var left = document.createElement("div");
      left.className = "flex items-start gap-3 min-w-0 flex-1";

      var iconEl = document.createElement("div");
      iconEl.className = "w-10 h-10 rounded-xl bg-neutral-900 border border-neutral-700 text-neutral-300 flex items-center justify-center text-xl shrink-0 transition-transform";
      iconEl.textContent = se.icon;

      var textWrap = document.createElement("div");
      textWrap.className = "space-y-0.5 min-w-0";

      var tagLine = document.createElement("div");
      tagLine.className = "flex items-center gap-1.5 text-[9px] font-mono";
      tagLine.innerHTML = '<span class="px-1.5 py-0.5 rounded bg-neutral-900 border border-neutral-700 font-bold ' + se.accent + '">' + se.tag + '</span>' +
        '<span class="text-neutral-400">' + se.meta + '</span>';

      var titleEl = document.createElement("div");
      titleEl.className = "font-black text-sm text-white font-hud flex items-center flex-wrap gap-1.5";
      titleEl.innerHTML = '<span>' + se.title + '</span><span class="text-[10px] font-normal text-neutral-400">(' + se.sub + ')</span>';

      var descEl = document.createElement("div");
      descEl.className = "text-[11px] text-neutral-400 line-clamp-2 leading-relaxed";
      descEl.textContent = se.desc;

      textWrap.appendChild(tagLine);
      textWrap.appendChild(titleEl);
      textWrap.appendChild(descEl);
      left.appendChild(iconEl);
      left.appendChild(textWrap);

      var right = document.createElement("div");
      right.className = "w-full sm:w-auto shrink-0 pt-1 sm:pt-0";

      var playBtn = document.createElement("button");
      playBtn.className = "w-full sm:w-auto px-4 py-2 rounded-xl font-black text-xs transition-all flex items-center justify-center gap-1.5 cursor-pointer bg-neutral-800 hover:bg-neutral-700 text-neutral-200 border border-neutral-700 active:scale-95";
      playBtn.innerHTML = '<span>🔊 試聴する</span>';

      playBtn.onclick = function() {
        if (typeof AudioEngine !== "undefined" && AudioEngine.play) {
          AudioEngine.play(se.key);
          iconEl.classList.add("scale-125");
          playBtn.classList.add("bg-amber-400", "text-neutral-950", "border-amber-400");
          playBtn.classList.remove("bg-neutral-800", "text-neutral-200");
          playBtn.innerHTML = '<span>🔊 再生中</span><span class="text-[10px]">✨</span>';

          var nowPlayingText = document.getElementById("soundtrackNowPlaying");
          var liveIcon = document.getElementById("soundtrackLiveIcon");
          if (nowPlayingText) {
            nowPlayingText.textContent = "🔊 " + se.title;
            nowPlayingText.className = "font-bold " + se.accent + " font-hud truncate";
            if (liveIcon) liveIcon.classList.remove("opacity-20");
          }

          if (sePlayingTimeout) clearTimeout(sePlayingTimeout);
          sePlayingTimeout = setTimeout(function() {
            sePlayingTimeout = null;
            iconEl.classList.remove("scale-125");
            playBtn.classList.remove("bg-amber-400", "text-neutral-950", "border-amber-400");
            playBtn.classList.add("bg-neutral-800", "text-neutral-200");
            playBtn.innerHTML = '<span>🔊 試聴する</span>';
            // BGMのステータス表示を復旧
            renderNowPlayingStatus();
          }, 1200);
        }
      };

      right.appendChild(playBtn);
      card.appendChild(left);
      card.appendChild(right);
      container.appendChild(card);
    });
  }

  function renderNowPlayingStatus() {
    var currentKey = (typeof AudioEngine !== "undefined" && AudioEngine.getCurrentBgm) ? AudioEngine.getCurrentBgm() : null;
    var nowPlayingText = document.getElementById("soundtrackNowPlaying");
    var liveIcon = document.getElementById("soundtrackLiveIcon");
    if (!nowPlayingText) return;

    var currentTrackDef = null;
    for (var i = 0; i < TRACK_DEFS.length; i++) {
      if (TRACK_DEFS[i].key === currentKey) {
        currentTrackDef = TRACK_DEFS[i];
        break;
      }
    }
    if (currentTrackDef) {
      nowPlayingText.textContent = currentTrackDef.icon + " " + currentTrackDef.title + " (" + currentTrackDef.bpm + ")";
      nowPlayingText.className = "font-bold text-amber-300 font-hud truncate";
      if (liveIcon) liveIcon.classList.remove("opacity-20");
    } else {
      nowPlayingText.textContent = "（停止中）";
      nowPlayingText.className = "font-bold text-neutral-500 font-hud truncate";
      if (liveIcon) liveIcon.classList.add("opacity-20");
    }
  }

  function render() {
    var container = document.getElementById("soundtrackTrackList");
    if (!container) return;
    container.innerHTML = "";

    var currentKey = (typeof AudioEngine !== "undefined" && AudioEngine.getCurrentBgm) ? AudioEngine.getCurrentBgm() : null;
    if (!sePlayingTimeout) {
      renderNowPlayingStatus();
    }

    if (currentTab === "bgm") {
      renderBGMList(container, currentKey);
    } else {
      renderSEList(container);
    }
  }

  function openModal() {
    var now = Date.now();
    if (now < tapCooldownUntil) return;
    tapCooldownUntil = now + 350;

    checkUnlockStatus();
    var modal = document.getElementById("modalSoundtrack");
    if (modal) {
      modal.classList.remove("hidden");
      isModalOpen = true;
      render();
    }
    if (typeof AudioEngine !== "undefined" && AudioEngine.play) {
      AudioEngine.play('tap');
    }
  }

  function closeModal() {
    var modal = document.getElementById("modalSoundtrack");
    if (modal) {
      modal.classList.add("hidden");
      isModalOpen = false;
    }
    if (typeof AudioEngine !== "undefined" && AudioEngine.play) {
      AudioEngine.play('tap');
    }
  }

  return {
    openModal: openModal,
    closeModal: closeModal,
    render: render,
    switchTab: switchTab,
    isUnlocked: isUnlocked,
    checkUnlockStatus: checkUnlockStatus
  };
})();

// スチル全画面拡大ライトボックスコントローラー（十一柱 意匠柱・現場柱監修）
var StillLightbox = (function() {
  var tapCooldownUntil = 0;

  function open(imgSrc, captionText) {
    var now = Date.now();
    if (now < tapCooldownUntil) return;
    tapCooldownUntil = now + 350;

    var modal = document.getElementById("modalStillLightbox");
    var img = document.getElementById("lightboxImage");
    var cap = document.getElementById("lightboxCaption");
    if (!modal || !img) return;

    img.src = imgSrc || "";
    if (cap) {
      cap.innerHTML = captionText || "";
      cap.classList.toggle("hidden", !captionText);
    }
    modal.classList.remove("hidden");
    if (typeof AudioEngine !== "undefined" && AudioEngine.play) {
      AudioEngine.play('tap');
    }
  }

  function close() {
    var modal = document.getElementById("modalStillLightbox");
    if (!modal) return;
    modal.classList.add("hidden");
    if (typeof AudioEngine !== "undefined" && AudioEngine.play) {
      AudioEngine.play('tap');
    }
  }

  if (typeof window !== "undefined") {
    window.addEventListener("keydown", function(e) {
      if (e.key === "Escape" || e.keyCode === 27) {
        var modal = document.getElementById("modalStillLightbox");
        if (modal && !modal.classList.contains("hidden")) {
          close();
        }
      }
    });
  }

  return {
    open: open,
    close: close
  };
})();

function openStillLightbox(imgSrc, captionText) {
  StillLightbox.open(imgSrc, captionText);
}

function closeStillLightbox() {
  StillLightbox.close();
}

if (typeof window !== "undefined") {
  window.UIController = UIController;
  window.QuizController = QuizController;
  window.CertRenderer = CertRenderer;
  window.TrophyGallery = TrophyGallery;
  window.SoundtrackGallery = SoundtrackGallery;
  window.TeacherDashboard = TeacherDashboard;
  window.StillLightbox = StillLightbox;
  window.openStillLightbox = openStillLightbox;
  window.closeStillLightbox = closeStillLightbox;

  // 桑原原則: ブラウザの『戻る』『進む』操作によるDOM・ステート乖離防止
  window.addEventListener("popstate", function(e) {
    if (e.state && e.state.view) {
      UIController.switchView(e.state.view, true);
    } else {
      var hash = window.location.hash.replace("#", "");
      if (hash && ["auth", "novel", "keepout", "badend", "trueend"].indexOf(hash) !== -1) {
        UIController.switchView(hash, true);
      }
    }
  });
}
